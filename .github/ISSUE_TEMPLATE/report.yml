name: Submit a display
description: Tell others which 42/43" monitor or TV you bought, in which country, and whether it works on Noron Air or Arc.
title: "[Report] "
labels: ["display-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping other customers choose a display. Photos of the VESA pattern, mount thickness, and side ports are very helpful.

        **Noron Air / Arc hard requirements**
        - 42" or 43" monitor or TV
        - VESA **200 × 200**
        - Thickness at the mounting area **< 78 mm**
        - Power / HDMI / DP cables must exit from the **side** (the mount has no rear cable hole)
        - **Game Mode** is required, otherwise input lag will be very bad
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (install and Game Mode OK)
        - Installs, but lag or other issues
        - Does not work
    validations:
      required: true
  - type: dropdown
    id: noron_model
    attributes:
      label: Your cabinet
      options:
        - Noron Air
        - Noron Arc
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country or region of purchase
      description: For example United States, Japan, Germany, China, Hong Kong, Australia. Use the place of purchase, which may differ from the delivery address.
      placeholder: Japan
    validations:
      required: true
  - type: input
    id: retailer
    attributes:
      label: Where you bought it
      description: Store or website, for example Amazon US, Best Buy, Bic Camera, JD.com, MediaMarkt.
      placeholder: Amazon US
    validations:
      required: true
  - type: dropdown
    id: product_type
    attributes:
      label: Type
      options:
        - Monitor
        - TV
        - Not sure
    validations:
      required: true
  - type: input
    id: brand
    attributes:
      label: Brand
      placeholder: LG
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Use the full model number, not only the series name. It is usually on the box, in the manual, or in the display settings.
      placeholder: 43UP8000PUA
    validations:
      required: true
  - type: dropdown
    id: size_inch
    attributes:
      label: Size
      options:
        - "42"
        - "43"
        - Other (explain in notes)
    validations:
      required: true
  - type: dropdown
    id: vesa
    attributes:
      label: VESA pattern
      options:
        - 200 × 200, confirmed
        - Not 200 × 200
        - Not sure
    validations:
      required: true
  - type: input
    id: thickness_mm
    attributes:
      label: Thickness at the mount (mm)
      description: Must be under 78 mm. Measure from the back of the panel to the VESA mounting face, including any bulge.
      placeholder: "65"
    validations:
      required: true
  - type: dropdown
    id: side_exits
    attributes:
      label: Cable exit location
      description: The bracket has no rear cable opening, so power and signal cables must exit from the side.
      options:
        - Side exits, cables can route
        - Rear exits only
        - Both side and rear
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: game_mode
    attributes:
      label: Game Mode
      options:
        - Has Game Mode, lag is acceptable
        - Has Game Mode, but lag is still high
        - No Game Mode
        - Not sure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: For example lag in real use, whether the stand had to be removed, cable routing tips, firmware or input warnings, or why it does not work. Write in your own language if you prefer.
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: Drag images here. Photos of the VESA holes, a side view of the mount (to show thickness), the side ports, and cable routing on the Noron cabinet are especially helpful.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: This is accurate to the best of my knowledge, and I agree it may be added to the public list.
          required: true
